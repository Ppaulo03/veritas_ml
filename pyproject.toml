[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritas-ml"
version = "0.1.0"
description = "Veritas ML: Auditable, model-agnostic experimental framework for representation and relational benchmarks"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
full = [
  "sentence-transformers>=3",
  "transformers>=4.40",
  "spacy>=3.7",
  "xgboost>=2",
  "torch-geometric>=2.5",
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
